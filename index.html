<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kunio Style Test</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>

<style>
body {
    margin: 0;
    background: #111;
}

canvas {
    display: block;
    margin: auto;
}
</style>
</head>

<body>

<script type="module">

import { setupWorld, createField } from './js/objects/Field.js';
import { Ball } from './js/objects/Ball.js';
import { Player } from './js/objects/Player.js';
import { Enemy } from './js/objects/Enemy.js';

class GameScene extends Phaser.Scene {

constructor() {
    super("GameScene");
}

preload() {

    this.load.spritesheet('player', 'assets/player_run.png', {
        frameWidth: 110,
        frameHeight: 233
    });

    this.load.spritesheet('enemy', 'assets/enemy_run.png', {
        frameWidth: 111,
        frameHeight: 211
    });

    this.load.spritesheet('player_kick', 'assets/player_kick.png', {
        frameWidth: 130,
        frameHeight: 206
    });

    this.load.spritesheet('enemy_kick', 'assets/enemy_kick.png', {
        frameWidth: 132,
        frameHeight: 213
    });

    this.load.spritesheet('player_tackle', 'assets/player_tackle.png', {
    frameWidth: 160,
    frameHeight: 221
    });

    this.load.spritesheet('enemy_tackle', 'assets/enemy_tackle.png', {
    frameWidth: 164,
    frameHeight: 218
});

    this.load.spritesheet('ball', 'assets/ball.png', {
        frameWidth: Math.floor(1409 / 12),
        frameHeight: 91
    });
    }

create() {

    setupWorld(this);
    createField(this);

    this.callKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);
    this.tackleKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.CTRL);
    this.shootKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    this.anims.create({
    key: 'player_tackle',
    frames: this.anims.generateFrameNumbers('player_tackle', {
        start: 0,
        end: 2
    }),
    frameRate: 12,
    repeat: 0
    });

    this.anims.create({
    key: 'enemy_tackle',
    frames: this.anims.generateFrameNumbers('enemy_tackle', {
        start: 0,
        end: 2
    }),
    frameRate: 12,
    repeat: 0
});

    this.anims.create({
        key: 'player_kick',
        frames: this.anims.generateFrameNumbers('player_kick', { start: 0, end: 2 }),
        frameRate: 10,
        repeat: 0
    });

    this.anims.create({
        key: 'enemy_kick',
        frames: this.anims.generateFrameNumbers('enemy_kick', { start: 0, end: 2 }),
        frameRate: 10,
        repeat: 0
    });

    this.goalLock = false;

    // PLAYER
    this.player = new Player(this, this.centerX, this.centerY);

    // BALL
    this.ball = new Ball(this, this.centerX + 50, this.centerY);

    // ENEMY
    this.enemy = new Enemy(this, this.centerX + 250, this.centerY, this.ball);

    // reset positions
    this.startPlayerX = this.centerX;
    this.startPlayerY = this.centerY;

    this.startEnemyX = this.centerX + 250;
    this.startEnemyY = this.centerY;

    // WORLD
    this.physics.world.setBounds(0, 0, this.worldWidth, this.worldHeight);

    this.cameras.main.setBounds(0, 0, this.worldWidth, this.worldHeight);
    this.cameras.main.startFollow(this.player.sprite);

    // ANIMS
    this.anims.create({
        key: 'ball_spin',
        frames: this.anims.generateFrameNumbers('ball', { start: 0, end: 11 }),
        frameRate: 12,
        repeat: -1
    });

    this.anims.create({
        key: 'run',
        frames: this.anims.generateFrameNumbers('player', { start: 0, end: 5 }),
        frameRate: 8,
        repeat: -1
    });

    this.anims.create({
        key: 'enemy_run',
        frames: this.anims.generateFrameNumbers('enemy', { start: 0, end: 4 }),
        frameRate: 10,
        repeat: -1
    });

    // SCORE
    this.scoreHome = 0;
    this.scoreAway = 0;

    this.homeText = this.add.text(20, 20, 'HOME 0', {
        fontSize: '28px',
        color: '#ffffff',
        fontStyle: 'bold'
    }).setScrollFactor(0);

    this.awayText = this.add.text(620, 20, 'AWAY 0', {
        fontSize: '28px',
        color: '#ffffff',
        fontStyle: 'bold'
    }).setScrollFactor(0);

    this.goalText = this.add.text(320, 260, 'GOAL!!', {
        fontSize: '56px',
        color: '#ffff00',
        fontStyle: 'bold'
    })
    .setScrollFactor(0)
    .setVisible(false);
}

update() {

    // PLAYER
    this.player.update();

    const dx = this.enemy.sprite.x - this.player.sprite.x;
    const dy = this.enemy.sprite.y - this.player.sprite.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    this.player.slowed = (
    this.ball.owner === 'player'
    );
    this.player.boosted = (this.ball.owner === 'enemy');

    // ROBO
    if (
    dist < 55 &&
    this.ball.owner === 'player' &&
    this.ball.state === 'IDLE' &&
    this.ball.protectTimer <= 0 &&
    !this.player.stunned &&
    !this.enemy.stunned
)
{
        this.player.stun(1500);
        this.ball.owner = 'enemy';
    }

    // CALL BALL
    if (Phaser.Input.Keyboard.JustDown(this.callKey)) {

        const callDist = Phaser.Math.Distance.Between(
            this.player.sprite.x,
            this.player.sprite.y,
            this.ball.sprite.x,
            this.ball.sprite.y
        );

        if (callDist < 260) {
            this.ball.owner = 'player';
            this.ball.state = 'IDLE';
            this.ball.protectTimer = 700;
        }
    }


    // TACKLE
    if (Phaser.Input.Keyboard.JustDown(this.tackleKey)) {
    this.player.tackle();
}

    // BALL OFFSET
    let offsetX = (this.player.lastDirection === 'left') ? -60 : 45;
    let offsetY = 50;

    if (this.player.cursors.up.isDown) offsetY = 35;
    else if (this.player.cursors.down.isDown) offsetY = 65;

    this.ball.update(this.player.sprite, offsetX, offsetY);

    // SHOOT
    if (Phaser.Input.Keyboard.JustDown(this.shootKey)) {

        if (this.ball.owner === 'player') {

            this.player.kick();

            let vx = 0;
            let vy = 0;

            const power = 350;

            if (this.player.lastDirection === 'left') vx = -power;
            if (this.player.lastDirection === 'right') vx = power;

            this.ball.shoot(vx, vy);
        }
    }

    // ENEMY
    this.enemy.update();

    if (this.enemy.state === 'tackle') {

    const dist = Phaser.Math.Distance.Between(
        this.enemy.sprite.x,
        this.enemy.sprite.y,
        this.player.sprite.x,
        this.player.sprite.y
    );

    if (dist < 70 && this.ball.owner === 'player') {

        this.player.stun(1200);

        this.ball.owner = 'enemy';
        this.ball.state = 'IDLE';
        this.ball.protectTimer = 500;
    }
}

    if (this.player.isTackling) {

    const dist = Phaser.Math.Distance.Between(
        this.player.sprite.x,
        this.player.sprite.y,
        this.enemy.sprite.x,
        this.enemy.sprite.y
    );

    if (dist < 70 && this.ball.owner === 'enemy') {

        this.enemy.stun(1000);

        this.ball.owner = 'player';
        this.ball.state = 'IDLE';
        this.ball.protectTimer = 500;
    }
}

    // PROTECT TIMER
    if (this.ball.protectTimer > 0) {
        this.ball.protectTimer -= this.game.loop.delta;
    }

    // GOALS
    const bx = this.ball.sprite.x;
    const by = this.ball.sprite.y;

    const goalTop = this.centerY - 90;
    const goalBottom = this.centerY + 90;

    if (!this.goalLock && bx < this.offsetX - 20 && by > goalTop && by < goalBottom) {
        this.goalLock = true;
        this.scoreAway++;
        this.updateScore();
        this.ballReset();
    }

    if (!this.goalLock && bx > this.offsetX + this.fieldWidth + 5 && by > goalTop && by < goalBottom) {
        this.goalLock = true;
        this.scoreHome++;
        this.updateScore();
        this.ballReset();
    }
}

updateScore() {
    this.homeText.setText('HOME ' + this.scoreHome);
    this.awayText.setText('AWAY ' + this.scoreAway);
}

ballReset() {

    this.player.sprite.body.setVelocity(0);
    this.enemy.sprite.body.setVelocity(0);
    this.ball.sprite.body.setVelocity(0);

    this.goalText.setVisible(true);
    this.physics.pause();

    this.time.delayedCall(1000, () => {

        this.player.sprite.x = this.startPlayerX;
        this.player.sprite.y = this.startPlayerY;

        this.enemy.sprite.x = this.startEnemyX;
        this.enemy.sprite.y = this.startEnemyY;

        this.ball.sprite.x = this.centerX + 50;
        this.ball.sprite.y = this.centerY;

        this.ball.state = 'IDLE';
        this.ball.owner = 'player';

        this.goalText.setVisible(false);
        this.physics.resume();
        this.goalLock = false;
    });
}
}

const config = {
type: Phaser.AUTO,
width: 800,
height: 600,
physics: { default: 'arcade' },
scene: [GameScene]
};

new Phaser.Game(config);

</script>

</body>
</html>
