<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kunio Style Test</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
        }

        canvas {
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>

<script type="module">
import { setupWorld, createField } from './js/objects/Field.js';
import { Ball } from './js/objects/Ball.js';

class GameScene extends Phaser.Scene {

    constructor() {
        super("GameScene");
    }

    preload() {

        this.load.spritesheet('player', 'assets/player_run.png', {
            frameWidth: 160,
            frameHeight: 259
        });

        this.load.spritesheet('ball', 'assets/ball.png', {
            frameWidth: Math.floor(1409 / 12),
            frameHeight: 91
        });
    }

    create() {

        setupWorld(this);
        createField(this);

        // =========================
        // PLAYER / ENEMY
        // =========================
        this.player = this.physics.add.sprite(this.centerX, this.centerY, 'player');
        this.player.setDepth(2);
        this.player.setScale(0.5);
        this.player.setCollideWorldBounds(true);

        this.enemy = this.physics.add.sprite(this.centerX + 250, this.centerY, 'player');
        this.enemy.setScale(0.5);
        this.enemy.setTint(0xff4444);
        this.enemy.setDepth(2);
        this.enemy.setCollideWorldBounds(true);

        // =========================
        // BALL (CONTROL CENTRALIZADO)
        // =========================
        this.ball = new Ball(this, this.centerX + 50, this.centerY);

        // =========================
        // WORLD / CAMERA
        // =========================
        this.physics.world.setBounds(0, 0, this.worldWidth, this.worldHeight);
        this.cameras.main.setBounds(0, 0, this.worldWidth, this.worldHeight);
        this.cameras.main.startFollow(this.player);

        // =========================
        // INPUT
        // =========================
        this.cursors = this.input.keyboard.createCursorKeys();
        this.shootKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

        // =========================
        // ANIMACIONES
        // =========================
        this.anims.create({
            key: 'ball_spin',
            frames: this.anims.generateFrameNumbers('ball', { start: 0, end: 11 }),
            frameRate: 12,
            repeat: -1
        });

        this.anims.create({
            key: 'run',
            frames: this.anims.generateFrameNumbers('player', { start: 0, end: 5 }),
            frameRate: 8,
            repeat: -1
        });
    }

    update() {

        // =========================
        // PLAYER INPUT
        // =========================
        const speed = 200;

        this.player.body.setVelocity(0);

        let moving = false;

        if (this.cursors.left.isDown) {
            this.player.body.setVelocityX(-speed);
            this.player.flipX = true;
            this.lastDirection = 'left';
            moving = true;
        }
        else if (this.cursors.right.isDown) {
            this.player.body.setVelocityX(speed);
            this.player.flipX = false;
            this.lastDirection = 'right';
            moving = true;
        }

        if (this.cursors.up.isDown) {
            this.player.body.setVelocityY(-speed);
            moving = true;
        }
        else if (this.cursors.down.isDown) {
            this.player.body.setVelocityY(speed);
            moving = true;
        }

        if (moving) {
            if (!this.player.anims.isPlaying) this.player.play('run');
        } else {
            this.player.stop();
            this.player.setFrame(0);
        }
        // =========================
        // BALL OFFSET
        // =========================
        let offsetX = 25;
        let offsetY = 50;

        if (this.lastDirection === 'left') offsetX = -60;
        else offsetX = 45;

        if (this.cursors.up.isDown) offsetY = 35;
        else if (this.cursors.down.isDown) offsetY = 65;

        // =========================
        // BALL CONTROL CENTRAL
        // =========================
        this.ball.update(this.player, offsetX, offsetY);

        // =========================
        // SHOOT
        // =========================
        if (Phaser.Input.Keyboard.JustDown(this.shootKey)) {
        this.ball.shoot(300, 0);
    }

        // =========================
        // LIMITES
        // =========================
        this.player.x = Phaser.Math.Clamp(
            this.player.x,
            this.offsetX + 40,
            this.offsetX + this.fieldWidth - 40
        );

        this.player.y = Phaser.Math.Clamp(
            this.player.y,
            this.offsetY - 70,
            this.offsetY + this.fieldHeight - 35
        );

        // =========================
        // ENEMY AI
        // =========================
        const enemySpeed = 120;

        const dx = this.ball.sprite.x - this.enemy.x;
        const dy = this.ball.sprite.y - this.enemy.y;

        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 5) {
            this.enemy.body.setVelocity(
                (dx / dist) * enemySpeed,
                (dy / dist) * enemySpeed
            );
        } else {
            this.enemy.body.setVelocity(0);
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: { default: 'arcade' },
    scene: [GameScene]
};

new Phaser.Game(config);
</script>

</body>
</html>
