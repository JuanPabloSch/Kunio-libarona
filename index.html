<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kunio Style Test</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
        }

        canvas {
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>

<script type="module">
import { setupWorld, createField } from './js/objects/Field.js';
import { Ball } from './js/objects/Ball.js';
import { Player } from './js/objects/Player.js';
import { Enemy } from './js/objects/Enemy.js';

class GameScene extends Phaser.Scene {

    constructor() {
        super("GameScene");
    }

    preload() {

        this.load.spritesheet('player', 'assets/player_run.png', {
            frameWidth: 160,
            frameHeight: 259
        });

        this.load.spritesheet('ball', 'assets/ball.png', {
            frameWidth: Math.floor(1409 / 12),
            frameHeight: 91
        });
    }

    create() {

    setupWorld(this);
    createField(this);
    
    this.callKey = this.input.keyboard.addKey(
    Phaser.Input.Keyboard.KeyCodes.SHIFT
    );

this.shootKey = this.input.keyboard.addKey(
    Phaser.Input.Keyboard.KeyCodes.SPACE
);

this.tackleKey = this.input.keyboard.addKey(
    Phaser.Input.Keyboard.KeyCodes.CTRL
);

    this.goalLock = false;

    // =========================
    // PLAYER
    // =========================
    this.player = new Player(
        this,
        this.centerX,
        this.centerY
    );

    // =========================
    // BALL
    // =========================
    this.ball = new Ball(
        this,
        this.centerX + 50,
        this.centerY
    );

    // =========================
    // ENEMY
    // =========================
    this.enemy = new Enemy(
        this,
        this.centerX + 250,
        this.centerY,
        this.ball
    );

    //Reset positions
    this.startPlayerX = this.centerX;
    this.startPlayerY = this.centerY;

    this.startEnemyX = this.centerX + 250;
    this.startEnemyY = this.centerY;

    // =========================
    // WORLD / CAMERA
    // =========================
    this.physics.world.setBounds(0, 0, this.worldWidth, this.worldHeight);

    this.cameras.main.setBounds(
        0, 0,
        this.worldWidth,
        this.worldHeight
    );

    this.cameras.main.startFollow(this.player.sprite);

    // =========================
    // INPUT
    // =========================
    this.shootKey = this.input.keyboard.addKey(
        Phaser.Input.Keyboard.KeyCodes.SPACE
    );

    // =========================
    // ANIMACIONES
    // =========================
    this.anims.create({
        key: 'ball_spin',
        frames: this.anims.generateFrameNumbers('ball', {
            start: 0,
            end: 11
        }),
        frameRate: 12,
        repeat: -1
    });

    this.anims.create({
        key: 'run',
        frames: this.anims.generateFrameNumbers('player', {
            start: 0,
            end: 5
        }),
        frameRate: 8,
        repeat: -1
    });
    // =========================
    // SCORE
    // =========================
    this.scoreHome = 0;
    this.scoreAway = 0;
    //Goal text
    this.homeText = this.add.text(
        20,
        20,
        'HOME 0',
        {
            fontSize: '28px',
            color: '#ffffff',
            fontStyle: 'bold'
        }
    ).setScrollFactor(0).setDepth(99);

    this.awayText = this.add.text(
        620,
        20,
        'AWAY 0',
        {
            fontSize: '28px',
            color: '#ffffff',
            fontStyle: 'bold'
        }
    ).setScrollFactor(0).setDepth(99);

    this.goalText = this.add.text(
    320,
    260,
    'GOAL!!',
    {
        fontSize: '56px',
        color: '#ffff00',
        fontStyle: 'bold'
    }
    )
    .setScrollFactor(0)
    .setDepth(200)
    .setVisible(false);
}

update() {

    // =========================
    // PLAYER
    // =========================
    this.player.update();
    // distancia enemy-player
    const dx = this.enemy.sprite.x - this.player.sprite.x;
    const dy = this.enemy.sprite.y - this.player.sprite.y;

    const dist = Math.sqrt(dx * dx + dy * dy);

    this.player.slowed = (
        this.ball.owner === 'player' &&
        dist < 140
    );

    this.player.boosted = (
        this.ball.owner === 'enemy'
    );

    // si enemy tiene pelota, player corre más rápido
    if (this.ball.owner === 'enemy') {
        this.player.boosted = true;
    }

    if (
    dist < 55 &&
    this.ball.state === 'IDLE' &&
    !this.player.stunned &&
    this.ball.owner === 'player' &&
    this.ball.protectTimer <= 0
) {
    this.player.stun(1500);

    this.ball.owner = 'enemy';
}
if (Phaser.Input.Keyboard.JustDown(this.callKey)) {

    const callDist = Phaser.Math.Distance.Between(
        this.player.sprite.x,
        this.player.sprite.y,
        this.ball.sprite.x,
        this.ball.sprite.y
    );

    if (
        callDist < 260 &&
        this.ball.owner !== 'player'
    ) {
        this.ball.owner = 'player';
        this.ball.state = 'IDLE';
        this.ball.protectTimer = 700;
    }
}

    if (Phaser.Input.Keyboard.JustDown(this.tackleKey)) {

    const tackleDist = Phaser.Math.Distance.Between(
        this.player.sprite.x,
        this.player.sprite.y,
        this.enemy.sprite.x,
        this.enemy.sprite.y
    );

    if (
    tackleDist < 80 &&
    this.ball.owner === 'enemy'
    ) {
        this.enemy.stun(1000);

        this.ball.owner = 'player';
        this.ball.state = 'IDLE';

        this.ball.protectTimer = 900;
    }
}

    // =========================
    // BALL OFFSET
    // =========================
    let offsetX = 25;
    let offsetY = 50;

    if (this.player.lastDirection === 'left') offsetX = -60;
    else offsetX = 45;

    if (this.player.cursors.up.isDown) offsetY = 35;
    else if (this.player.cursors.down.isDown) offsetY = 65;

    // =========================
    // BALL
    // =========================
    this.ball.update(this.player.sprite, offsetX, offsetY);

    // =========================
    // SHOOT
    // =========================
    if (
    Phaser.Input.Keyboard.JustDown(this.shootKey) &&
    this.ball.owner === 'player'
) {

        let vx = 0;
        let vy = 0;

        const power = 350;

        if (this.player.lastDirection === 'left') vx = -power;
        if (this.player.lastDirection === 'right') vx = power;

        if (this.player.cursors.up.isDown) vy = -power;
        if (this.player.cursors.down.isDown) vy = power;

        this.ball.shoot(vx, vy);
    }

    // =========================
    // LIMITES
    // =========================
    this.player.sprite.x = Phaser.Math.Clamp(
        this.player.sprite.x,
        this.offsetX + 40,
        this.offsetX + this.fieldWidth - 40
    );

    this.player.sprite.y = Phaser.Math.Clamp(
        this.player.sprite.y,
        this.offsetY - 70,
        this.offsetY + this.fieldHeight - 35
    );

    // =========================
    // ENEMY
    // =========================
    this.enemy.update();

    // =========================
    // GOALS
    // =========================
    const bx = this.ball.sprite.x;
    const by = this.ball.sprite.y;

    const goalTop = this.centerY - 90;
    const goalBottom = this.centerY + 90;

    // gol izquierda = AWAY
    if (
    !this.goalLock &&
    bx < this.offsetX - 20 &&
    by > goalTop &&
    by < goalBottom
    ) {
        this.goalLock = true;
        this.scoreAway++;
        this.updateScore();
        this.ballReset();
    }

    // gol derecha = HOME
    if (
    !this.goalLock &&
    bx > this.offsetX + this.fieldWidth + 5 &&
    by > goalTop &&
    by < goalBottom
    ) {
    this.goalLock = true;
    this.scoreHome++;
    this.updateScore();
    this.ballReset();
    }
}
    updateScore() {
        this.homeText.setText('HOME ' + this.scoreHome);
        this.awayText.setText('AWAY ' + this.scoreAway);
    }

    ballReset() {

    // frenar todo
    this.player.sprite.body.setVelocity(0);
    this.enemy.sprite.body.setVelocity(0);
    this.ball.sprite.body.setVelocity(0);

    // mostrar cartel
    this.goalText.setVisible(true);

    // congelar momentáneo
    this.physics.pause();

    this.time.delayedCall(1000, () => {

        // reset posiciones
        this.player.sprite.x = this.startPlayerX;
        this.player.sprite.y = this.startPlayerY;

        this.enemy.sprite.x = this.startEnemyX;
        this.enemy.sprite.y = this.startEnemyY;

        this.ball.sprite.x = this.centerX + 50;
        this.ball.sprite.y = this.centerY;

        this.ball.state = 'IDLE';
        this.ball.owner = 'player';

        this.goalText.setVisible(false);

        this.physics.resume();
        this.goalLock = false;

    });
}
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: { default: 'arcade' },
    scene: [GameScene]
};

new Phaser.Game(config);
</script>

</body>
</html>
