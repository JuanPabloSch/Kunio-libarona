<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kunio Style Test</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
        }

        canvas {
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>

<script type="module">
import { setupWorld, createField } from './js/objects/Field.js';

class GameScene extends Phaser.Scene {

    constructor() {
        super("GameScene");
    }

    preload() {

        this.load.spritesheet('player', 'assets/player_run.png', {
            frameWidth: 160,
            frameHeight: 259
        });

        this.load.spritesheet('ball', 'assets/ball.png', {
            frameWidth: Math.floor(1409 / 12),
            frameHeight: 91
        });
    }

create() {

    setupWorld(this);
    createField(this);

    const centerX = this.centerX;
    const centerY = this.centerY;
    const offsetX = this.offsetX;
    const offsetY = this.offsetY;
    const fieldWidth = this.fieldWidth;
    const fieldHeight = this.fieldHeight;
    const worldWidth = this.worldWidth;
    const worldHeight = this.worldHeight;
    
    // =========================
    // 🧍 PLAYER
    // =========================
    this.player = this.physics.add.sprite(
        centerX,
        centerY,
        'player'
    );
    this.player.setDepth(2);
    this.player.setScale(0.5);
    this.player.setCollideWorldBounds(true);

    this.enemy = this.physics.add.sprite(
    centerX + 250,
    centerY,
    'player'
    );

    this.enemy.setScale(0.5);
    this.enemy.setTint(0xff4444); // rojo rival
    this.enemy.setDepth(2);
    this.enemy.setCollideWorldBounds(true);

    // =========================
    // ⚽ BALL
    // =========================
    this.ball = this.physics.add.sprite(
        centerX + 50,
        centerY,
        'ball'
    );

    this.ball.setScale(0.3);
    this.ball.setDepth(1);
    this.ball.setImmovable(true);
    this.ball.body.setAllowGravity(false);
    this.ball.setDamping(false);
    this.ball.setDrag(90);
    this.ball.setMaxVelocity(500);


    // =========================
    // 🌍 WORLD + CÁMARA
    // =========================
    this.physics.world.setBounds(0, 0, worldWidth, worldHeight);

    this.cameras.main.setBounds(0, 0, worldWidth, worldHeight);
    this.cameras.main.startFollow(this.player);

    // =========================
    // 🎮 INPUT
    // =========================
    this.cursors = this.input.keyboard.createCursorKeys();

    // =========================
    // 🎞 ANIMACIONES
    // =========================
    this.anims.create({
        key: 'ball_spin',
        frames: this.anims.generateFrameNumbers('ball', {
            start: 0,
            end: 11
        }),
        frameRate: 12,
        repeat: -1
    });

    

    this.anims.create({
        key: 'run',
        frames: this.anims.generateFrameNumbers('player', {
            start: 0,
            end: 5
        }),
        frameRate: 8,
        repeat: -1
    });
        this.ballShot = false;

    this.shootKey = this.input.keyboard.addKey(
        Phaser.Input.Keyboard.KeyCodes.SPACE
    );
}

update() {

    const isMoving =
    this.cursors.left.isDown ||
    this.cursors.right.isDown ||
    this.cursors.up.isDown ||
    this.cursors.down.isDown;

    if (isMoving) {
    if (!this.ball.anims.isPlaying) {
        this.ball.play('ball_spin');
    }
} 

if (isMoving) {
    this.ball.play('ball_spin', true);
} else {
    this.ball.anims.stop();
}

    const speed = 200;

    let moving = false;

    // reset velocidad
    this.player.body.setVelocity(0);

    // horizontal
    if (this.cursors.left.isDown) {
        this.player.body.setVelocityX(-speed);
        this.player.flipX = true;
        this.lastDirection = 'left';
        moving = true;
    }
    else if (this.cursors.right.isDown) {
        this.player.body.setVelocityX(speed);
        this.player.flipX = false;
        this.lastDirection = 'right';
        moving = true;
    }

    // vertical
    if (this.cursors.up.isDown) {
        this.player.body.setVelocityY(-speed);
        moving = true;
    }
    else if (this.cursors.down.isDown) {
        this.player.body.setVelocityY(speed);
        moving = true;
    }

    // animación
    if (moving) {
        if (!this.player.anims.isPlaying) {
            this.player.play('run');
        }
    } else {
        this.player.stop();
        this.player.setFrame(0);
    }

    // offset pelota limpio
    let offsetX = 25;
    let offsetY = 50;

    // izquierda / derecha
    if (this.lastDirection === 'left') {
        offsetX = -60;
    } else {
        offsetX = 45;
    }

    // arriba / abajo
    if (this.cursors.up.isDown) {
        offsetY = 35;
    }
    else if (this.cursors.down.isDown) {
        offsetY = 65;
    }

    if (!this.ballShot) {

    this.ball.x = Phaser.Math.Linear(this.ball.x, this.player.x + offsetX, 0.25);
    this.ball.y = Phaser.Math.Linear(this.ball.y, this.player.y + offsetY, 0.25);

}

// =========================
// 💥 SHOOT
// =========================
if (Phaser.Input.Keyboard.JustDown(this.shootKey)) {

    this.ballShot = true;

    this.ball.body.setVelocity(300, 0);

}

// =========================
// 🚧 LIMITES CANCHA PLAYER
// =========================
this.player.x = Phaser.Math.Clamp(
    this.player.x,
    this.offsetX + 40,
    this.offsetX + this.fieldWidth - 40
);

this.player.y = Phaser.Math.Clamp(
    this.player.y,
    this.offsetY - 70,
    this.offsetY + this.fieldHeight - 35
);

    // =========================
    // 👹 ENEMY SIGUE PELOTA
    // =========================
    const enemySpeed = 120;

    const dx = this.ball.x - this.enemy.x;
    const dy = this.ball.y - this.enemy.y;

    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 5) {
        this.enemy.body.setVelocity(
            (dx / dist) * enemySpeed,
            (dy / dist) * enemySpeed
        );
    } else {
        this.enemy.body.setVelocity(0);
    }
}
}



const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: {
        default: 'arcade'
    },
    scene: [GameScene]
};

new Phaser.Game(config);
</script>

</body>
</html>
